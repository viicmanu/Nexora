[project]
name = "nexora-backend"
version = "0.1.0"
description = "Backend local de Nexora: clasificación de archivos con IA, índice semántico y API para escritorio y móvil."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "watchdog>=5.0",
    "chromadb>=1.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "httpx>=0.27",
    "send2trash>=1.8",
    "zeroconf>=0.130",
    "cryptography>=42",
    # Proveedor por defecto. Los demás se instalan con los extras de abajo.
    "anthropic>=0.70",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.20"]
dev = ["pytest>=8.0"]

[project.scripts]
nexora-backend = "nexora.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexora*"]

[tool.setuptools.package-data]
"nexora.db" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
