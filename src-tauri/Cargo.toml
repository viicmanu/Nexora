[package]
name = "nexora"
version = "0.1.0"
description = "Nexora - organizador inteligente de archivos"
authors = ["Nexora"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# El sufijo _lib evita un conflicto de nombres con el binario en Windows.
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
mdns-sd = "0.22.0"
sha2 = "0.10.9"
hex = "0.4.3"
futures-util = "0.3.34"
tokio = { version = "1", features = ["fs", "io-util", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
