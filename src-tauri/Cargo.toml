[package]
name = "nexora"
version = "0.1.0"
description = "Nexora - organizador inteligente de archivos"
authors = ["Nexora"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
# El sufijo _lib evita un conflicto de nombres con el binario en Windows.
name = "nexora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
